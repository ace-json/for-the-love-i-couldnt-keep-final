
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>If It's Meant to Be</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    height: 100vh;
    overflow: hidden;
    background: #171512;
    color: #f4eee5;
    font-family: 'DM Sans', sans-serif;
}

.scene {
    min-height: 100vh;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 40px 20px 9vh;
    position: relative;
    isolation: isolate;
    overflow: hidden;
}

.photo {
    position: absolute;
    inset: 0;
    z-index: -3;

    background-image: url("YOUR_PHOTO.jpg");
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
    background-color: #171512;
}

.overlay {
    position: absolute;
    inset: 0;
    z-index: -2;
    background: linear-gradient(
        to bottom,
        rgba(0,0,0,.15),
        rgba(0,0,0,.18) 35%,
        rgba(0,0,0,.75)
    );
}

.grain {
    position: absolute;
    inset: 0;
    z-index: -1;
    opacity: .12;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.35'/%3E%3C/svg%3E");
}

.content {
    width: 100%;
    max-width: 620px;
    text-align: center;
    animation: fadeIn 2s ease;
}

h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(42px, 8vw, 76px);
    font-weight: 400;
    line-height: 1;
    margin-bottom: 28px;
    text-shadow: 0 2px 20px rgba(0,0,0,.3);
}

.timer {
    display: inline-block;
    padding: 15px 22px;
    margin-bottom: 26px;
    background: rgba(20,18,16,.2);
    backdrop-filter: blur(8px);
    border-top: 1px solid rgba(255,255,255,.3);
    border-bottom: 1px solid rgba(255,255,255,.3);
}

.timer-label {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: .8;
    margin-bottom: 12px;
}

.digits {
    display: flex;
    justify-content: center;
    gap: 20px;
    font-variant-numeric: tabular-nums;
}

.unit {
    min-width: 40px;
}

.number {
    display: block;
    font-family: 'Cormorant Garamond', serif;
    font-size: 36px;
    line-height: 1;
}

.unit-name {
    display: block;
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: .75;
    margin-top: 6px;
}

.since {
    font-size: 11px;
    opacity: .7;
    margin-top: 10px;
}

.music {
    max-width: 355px;
    width: 100%;
    margin: auto;
    overflow: hidden;
    border-radius: 12px;
}

.music iframe {
    width: 100%;
    height: 80px;
    border: none;
    display: block;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media(max-width: 420px) {
    .digits {
        gap: 10px;
    }

    .number {
        font-size: 29px;
    }

    .scene {
        padding-bottom: 8vh;
    }
}
</style>
</head>

<body>

<main class="scene">

    <div class="photo"></div>
    <div class="overlay"></div>
    <div class="grain"></div>

    <section class="content">

        <h1>
            If it's meant to be,<br>
            then it will be.
        </h1>

        <div class="timer">

            <div class="timer-label">
                Time since October 31, 2026 2:07 PM
            </div>

            <div class="digits">

                <div class="unit">
                    <span class="number" id="days">0</span>
                    <span class="unit-name">Days</span>
                </div>

                <div class="unit">
                    <span class="number" id="hours">00</span>
                    <span class="unit-name">Hours</span>
                </div>

                <div class="unit">
                    <span class="number" id="minutes">00</span>
                    <span class="unit-name">Minutes</span>
                </div>

                <div class="unit">
                    <span class="number" id="seconds">00</span>
                    <span class="unit-name">Seconds</span>
                </div>

            </div>

            <div class="since">Since the last time I heard your voice when I called</div>

        </div>

        <div class="music">
            <iframe
                src="https://open.spotify.com/embed/track/6fKIyDJHZ9m84jRhSmpuwS?utm_source=generator&theme=0"
                title="Sun Bleached Flies by Ethel Cain"
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                loading="lazy">
            </iframe>
        </div>

    </section>

</main>

<script>

// October 31, 2026, 2:20 PM Philippine time
const startDate = new Date(
    "2026-10-31T14:07:00+08:00"
).getTime();

function updateTimer() {

    const now = Date.now();

    // Prevent negative elapsed time before the starting date
    const elapsed = Math.max(0, now - startDate);

    const totalSeconds = Math.floor(elapsed / 1000);

    const days = Math.floor(totalSeconds / 86400);
    const hours = Math.floor((totalSeconds % 86400) / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    document.getElementById("days").textContent = days;

    document.getElementById("hours").textContent =
        String(hours).padStart(2, "0");

    document.getElementById("minutes").textContent =
        String(minutes).padStart(2, "0");

    document.getElementById("seconds").textContent =
        String(seconds).padStart(2, "0");
}

updateTimer();
setInterval(updateTimer, 1000);

</script>

</body>
</html>
